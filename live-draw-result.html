function openExactSettings(){try{if(window.Android&&Android.openExactAlarmSettings)Android.openExactAlarmSettings()}catch(e){}}
function openNotifSettings(){try{if(window.Android&&Android.openNotificationSettings)Android.openNotificationSettings()}catch(e){}}
function showSettings(){page='settings';let q=settingsSearch.toLowerCase(),list=sortedMarkets().filter(m=>!q||m.name.toLowerCase().includes(q));app.innerHTML=`<div class="safe"><header class="input-header"><button class="back" onclick="home()">‹</button><div class="input-title">Pengaturan</div></header><main class="settings-page"><section class="settings-card"><h3>Kelola Pasaran</h3><p>Tambah pasaran baru atau edit nama pasaran yang sudah ada. Pasaran baru langsung ikut Home, pengurutan Betclose, hari result, dan reminder.</p><button class="add-market-btn" onclick="showAddMarket()">＋ TAMBAH PASARAN</button><div class="market-count-note">Total saat ini: ${markets.length} pasaran</div></section><section class="settings-card"><h3>Backup & Restore</h3><p>Simpan daftar pasaran, nama hasil edit, jadwal, hari result, mode Singapore, dan hasil hari ini ke file JSON.</p><div class="settings-actions"><button onclick="exportBackup()">EXPORT BACKUP</button><button onclick="importBackup()">IMPORT BACKUP</button></div></section><section class="settings-card"><h3>Kelola Jadwal & Hari Result</h3><p>Tekan ikon pensil untuk mengubah nama, Betclose, Result, dan hari result tiap pasaran.</p></section><input class="search" placeholder="Cari pasaran..." value="${esc(settingsSearch)}" oninput="settingsSearch=this.value;showSettings()"><div class="schedule-list">${list.map(settingsRow).join('')}</div></main>${bottomNav('settings')}</div>`}
function settingsRow(m){let activeDays=normalizeDays(m.days,m.originalName||m.name).length;return `<div class="schedule-row"><div class="schedule-name">${esc(m.name)}<div style="font-size:7.8px;color:#78909b;margin-top:2px">${activeDays}/7 hari result${m.builtin?'':' · Tambahan'}</div></div><div class="schedule-time">${m.betclose||'--:--'}</div><div class="schedule-time">${m.result||'--:--'}</div><button class="pencil" onclick='openScheduleEditor(${JSON.stringify(m.key)},"settings")'>✎</button></div>`}
function showAddMarket(){page='addmarket';addType=1;app.innerHTML=`<div class="safe"><header class="input-header"><button class="back" onclick="showSettings()">‹</button><div class="input-title">Tambah Pasaran</div></header><main class="input-content"><section class="editor-card"><div class="name-field"><label>NAMA PASARAN</label><input id="addMarketName" maxlength="50" autocomplete="off" placeholder="Contoh: PASARAN BARU"></div><div class="type-field"><label>TIPE INPUT</label><div class="type-grid"><button id="addType1" class="type-btn on" onclick="setAddType(1)">1 PRIZE</button><button id="addType3" class="type-btn" onclick="setAddType(3)">3 PRIZE</button></div></div><div class="time-fields"><div class="time-field"><label>BETCLOSE</label><input id="addBetclose" type="time"></div><div class="time-field"><label>RESULT</label><input id="addResult" type="time"></div></div><div class="day-settings"><h4>HARI RESULT</h4><div class="day-grid">${DAY_NAMES.map((d,i)=>`<button id="addDay${i}" class="day-toggle on" data-on="1" onclick="toggleAddDay(${i})">${d}</button>`).join('')}</div><div class="day-legend">Default pasaran baru: result setiap hari. Matikan hari yang tidak ada livedraw.</div></div><button class="save-schedule" onclick="saveNewMarket()">TAMBAHKAN PASARAN</button><div class="hint">Setelah ditambahkan, pasaran langsung muncul di Home dan posisinya mengikuti jam Betclose.</div></section></main></div>`}
function setAddType(n){addType=n===3?3:1;let a=document.getElementById('addType1'),b=document.getElementById('addType3');if(a)a.classList.toggle('on',addType===1);if(b)b.classList.toggle('on',addType===3)}
function toggleAddDay(i){let el=document.getElementById('addDay'+i);if(!el)return;let on=el.dataset.on==='1';el.dataset.on=on?'0':'1';el.classList.toggle('on',!on);el.classList.toggle('off',on)}
function selectedAddDays(){return ALL_DAYS.filter(i=>{let el=document.getElementById('addDay'+i);return el&&el.dataset.on==='1'})}
function saveNewMarket(){let name=document.getElementById('addMarketName').value.trim(),b=document.getElementById('addBetclose').value.trim(),r=document.getElementById('addResult').value.trim(),days=selectedAddDays();if(!name){nativeToast('Nama pasaran wajib diisi');return}if(!uniqueMarketName(name,null)){nativeToast('Nama pasaran sudah digunakan');return}if(b&&!validTime(b)){nativeToast('Jam betclose tidak valid');return}if(r&&!validTime(r)){nativeToast('Jam result tidak valid');return}let key=`c_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,7)}`;let maxId=markets.reduce((n,m)=>Math.max(n,Number(m.id)||0),0);markets.push({id:maxId+1,key,originalName:name,name,betclose:b||null,result:r||null,type:addType,days,special:'',builtin:false});persistSchedules();nativeToast('Pasaran baru ditambahkan');showSettings()}
function exportBackup(){let sg=markets.find(isSingapore);let payload={schema:4,app:'DINGDONGTOGEL RESULT',createdAt:new Date().toISOString(),resultDate:dateKey(),schedules:currentScheduleMap(),singaporeMode:sg?modeFor(sg):3,resultsToday:getResults()};let json=JSON.stringify(payload,null,2);try{if(window.Android&&Android.exportBackup){Android.exportBackup(json);return}}catch(e){}let blob=new Blob([json],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`RESULT-backup-${dateKey()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importBackup(){try{if(window.Android&&Android.importBackup){Android.importBackup();return}}catch(e){}let input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=()=>{let f=input.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>applyBackupFromNative(String(rd.result||''));rd.readAsText(f)};input.click()}
window.applyBackupFromNative=function(json){try{let data=JSON.parse(json);if(!data||typeof data.schedules!=='object')throw new Error('invalid');applyScheduleMap(data.schedules);persistSchedules();if([1,3,6].includes(Number(data.singaporeMode)))localStorage.setItem('livedraw.sg.mode',String(data.singaporeMode));if(data.resultDate===dateKey()&&data.resultsToday&&typeof data.resultsToday==='object')saveResults(data.resultsToday);nativeToast('Backup berhasil dipulihkan');showSettings()}catch(e){nativeToast('File backup tidak valid')}}
window.nativeBack=function(){if(page==='schedule'){backFromSchedule();return true}if(page==='addmarket'){showSettings();return true}if(page!=='home'){home();return true}return false}
window.appResume=function(){loadSchedules();if(page==='home')renderHome();else if(page==='input')renderInput();else if(page==='notif')showNotifications();else if(page==='settings')showSettings();else if(page==='schedule')renderScheduleEditor();else if(page==='addmarket')showAddMarket()}
loadSchedules();
setInterval(()=>{if(page==='home')renderHome()},15000);
renderHome();
</script>
</body>
</html>
